<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Color Me</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffe066">

<!-- launched from an iPad home screen this runs without browser chrome, so
     there is no address bar for a small child to wander into -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Color Me">

<!-- Asset URLs carry a version stamp. Added to a home screen this app is served
     out of a cache no address bar can reach past, so a changed file has to
     arrive under a name that cache has never seen. BUMP THE STAMP ON ALL THREE
     WHENEVER app.js, styles.css OR drawings.js CHANGES -- otherwise the old
     copy keeps being served. See "Shipping a new version" in the README. -->
<link rel="stylesheet" href="styles.css?v=20260904">
</head>
<body>

<!-- ============ PICKER SCREEN ============ -->
<section id="picker-screen" class="screen">
  <button id="btn-refresh" class="refresh-btn" title="Get the newest version"
          aria-label="Get the newest version">&#8635;</button>
  <h1 class="title">Color Me</h1>
  <p class="subtitle">Pick a picture!</p>

  <!-- the rail sits in the gallery's right gutter and does not scroll with it -->
  <div class="gallery-wrap">
    <div id="gallery" class="gallery"></div>
    <div id="jump-rail" class="jump-rail"></div>
  </div>
</section>

<!-- ============ COLORING SCREEN ============ -->
<section id="color-screen" class="screen hidden">
  <header class="toolbar">
    <button id="btn-back" class="tool-btn" title="Back to pictures">&#8592; Pictures</button>
    <span id="drawing-name" class="drawing-name"></span>
    <span class="toolbar-spacer"></span>
    <button id="btn-undo" class="tool-btn" title="Undo">&#8630; Undo</button>

    <div class="tool-more">
      <button id="btn-more" class="tool-btn" title="More" aria-label="More"
              aria-expanded="false">&#8943;</button>
      <div id="tool-menu" class="tool-menu">
        <button id="btn-refresh-bar" class="tool-btn" title="Get the newest version"
                aria-label="Get the newest version">&#8635;</button>
        <button id="btn-clear" class="tool-btn" title="Start over">Start Over</button>
        <button id="btn-save" class="tool-btn tool-btn-primary" title="Save picture">&#11015; Save</button>
      </div>
    </div>
  </header>

  <div class="canvas-wrap">
    <div class="canvas-frame">
      <div id="canvas" class="canvas"></div>

      <div id="pan-pad" class="pan-pad hidden">
        <button class="pan-btn pan-up"    data-pan="up"    aria-label="Move up">&#9650;</button>
        <button class="pan-btn pan-left"  data-pan="left"  aria-label="Move left">&#9664;</button>
        <button class="pan-btn pan-right" data-pan="right" aria-label="Move right">&#9654;</button>
        <button class="pan-btn pan-down"  data-pan="down"  aria-label="Move down">&#9660;</button>
      </div>

      <div class="zoom-controls">
        <button id="btn-zoom-in" class="zoom-btn" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="btn-zoom-reset" class="zoom-btn zoom-level" title="Fit the whole picture"
                aria-label="Fit the whole picture">1&#215;</button>
        <button id="btn-zoom-out" class="zoom-btn" title="Zoom out" aria-label="Zoom out">&#8722;</button>
      </div>
    </div>
  </div>

  <footer class="palette-bar">
    <div id="brushes" class="brushes hidden"></div>
    <div id="palette" class="palette"></div>

    <div id="mixer" class="mixer hidden">
      <canvas id="wheel" class="wheel" width="240" height="240"></canvas>
      <canvas id="brightness" class="brightness" width="240" height="34"></canvas>
      <div class="mixer-row">
        <span id="mix-preview" class="mix-preview"></span>
        <div id="mix-slots" class="mix-slots"></div>
        <button id="btn-mix-done" class="tool-btn tool-btn-primary">Done</button>
      </div>
    </div>
    <button id="btn-color" class="color-button" title="Pick a color" aria-label="Pick a color"
            aria-expanded="false"></button>
  </footer>
</section>

<div id="confirm" class="modal hidden" role="dialog" aria-modal="true"
     aria-labelledby="confirm-title">
  <div class="modal-card">
    <h2 id="confirm-title" class="modal-title">Start over?</h2>
    <p id="confirm-text" class="modal-text">This clears the whole picture.</p>
    <div class="modal-buttons">
      <button id="btn-keep" class="tool-btn tool-btn-primary">Keep coloring</button>
      <button id="btn-confirm-clear" class="tool-btn">Start over</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="drawings.js?v=20260904"></script>
<script src="app.js?v=20260904"></script>
</body>
</html>
